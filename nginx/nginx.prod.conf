server {
    listen 80;
    server_name film-frontend.nomorepartiessite.ru film-backend.nomorepartiessite.ru;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name film-frontend.nomorepartiessite.ru film-backend.nomorepartiessite.ru;

    ssl_certificate /etc/letsencrypt/live/film-frontend.nomorepartiessite.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/film-frontend.nomorepartiessite.ru/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /content/ {
        proxy_pass http://backend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}